server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          # 开启基于服务发现的自动路由，例如 /user-service/users 可直接转发到 user-service
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1      # 去掉 /api 前缀，转发为 /users/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # 缩短注册表拉取间隔，演示环境秒级感知实例上下线
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,routes
